spring:
  application:
    name: ticket-master

  datasource:
    url: jdbc:postgresql://localhost:5435/ticketbooking
    username: ticket_user
    password: ticket_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  logging:
    level:
      org.hibernate.SQL: debug
