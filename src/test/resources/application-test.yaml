# src/test/resources/application-test.yml

spring:
  datasource:
    # 1. Spin up an isolated, in-memory H2 instance that persists for the whole test execution
    url: jdbc:h2:mem:ticketbooking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    # 2. Enable the H2 browser console so you can inspect data during debugging if needed
    console:
      enabled: true
      path: /h2-console

  jpa:
    # 3. Inform Hibernate to generate SQL syntax compatible with H2 structures
    database-platform: org.hibernate.dialect.H2Dialect
    # 4. Automatically generate tables from @Entity definitions before tests, then discard them after
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Prevents newer Hibernate engines from ignoring your chosen dialect metadata
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true
