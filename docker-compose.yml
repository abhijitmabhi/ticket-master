services:
  postgres:
    image: postgres:16
    container_name: ticket-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
    ports:
      - "5435:5432"
    volumes:
      - ticket-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticketbooking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ticket-pg-data:
  